<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Rifa Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-900 p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-800">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-white">Crear Cuenta</h1>
            <p class="text-sm text-slate-400 mt-1">Registrate para poder registrar ventas de números</p>
        </div>

        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">Nombre Completo</label>
                <input type="text" id="regName" required placeholder="María Pérez"
                       class="w-full px-4 py-2 bg-slate-950 border border-slate-800 rounded-lg text-white placeholder-slate-600 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">Correo Electrónico</label>
                <input type="email" id="regEmail" required placeholder="tu@email.com"
                       class="w-full px-4 py-2 bg-slate-950 border border-slate-800 rounded-lg text-white placeholder-slate-600 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">Contraseña</label>
                <input type="password" id="regPassword" required placeholder="••••••••"
                       class="w-full px-4 py-2 bg-slate-950 border border-slate-800 rounded-lg text-white placeholder-slate-600 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-lg shadow transition">
                Crear mi cuenta
            </button>
        </form>

        <p class="text-center text-sm text-slate-400 mt-6">
            ¿Ya tenés cuenta?
            <a href="/login.html" class="text-indigo-400 font-semibold hover:underline">Iniciá sesión</a>
        </p>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
